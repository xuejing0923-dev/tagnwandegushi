    <path d="M109 109 L120 120"/><path d="M140 140 L151 151"/>
    <path d="M151 109 L140 120"/><path d="M120 140 L109 151"/>
  </g>
  <circle cx="130" cy="130" r="9" fill="none" stroke="rgba(120,110,95,.5)" stroke-width="1.4"/>
  <ellipse cx="112" cy="112" rx="14" ry="9" transform="rotate(-35 112 112)"
           fill="#FFFFFF" opacity=".5"/>
</svg>
